<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QS1 Clock</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: #040405;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', Arial, sans-serif;
  }

  .scene {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* ── OUTER RINGS ── */
  .ring-outer {
    position: absolute;
    width: 380px; height: 380px;
    border-radius: 50%;
    border: 1px solid rgba(163,217,255,0.06);
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    animation: ring-pulse 5s ease-in-out infinite;
  }
  .ring-mid {
    position: absolute;
    width: 320px; height: 320px;
    border-radius: 50%;
    border: 1px solid rgba(163,217,255,0.08);
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    animation: ring-pulse 5s ease-in-out 0.8s infinite;
  }
  @keyframes ring-pulse {
    0%,100% { opacity:0.4; transform: translate(-50%,-50%) scale(1); }
    50%      { opacity:1;   transform: translate(-50%,-50%) scale(1.03); }
  }

  /* ── CLOCK BODY ── */
  .clock {
    position: relative;
    width: 260px; height: 260px;
  }

  canvas {
    display: block;
  }

  /* ── DIGITAL READOUT ── */
  .digital {
    text-align: center;
  }
  .digital-time {
    font-size: 36px;
    font-weight: 200;
    letter-spacing: 0.12em;
    color: #A3D9FF;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin-bottom: 8px;
    text-shadow: 0 0 30px rgba(163,217,255,0.5);
  }
  .digital-time .seconds {
    font-size: 22px;
    color: rgba(245,158,11,0.85);
    font-weight: 300;
  }
  .digital-date {
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #3A3A3A;
    margin-bottom: 4px;
  }
  .digital-label {
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: rgba(163,217,255,0.3);
  }

  /* ── LIVE BADGE ── */
  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: rgba(163,217,255,0.05);
    border: 1px solid rgba(163,217,255,0.15);
    border-radius: 100px;
    padding: 5px 14px;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: rgba(163,217,255,0.6);
  }
  .live-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #A3D9FF;
    animation: dot-pulse 2.2s ease-in-out infinite;
  }
  @keyframes dot-pulse {
    0%,100% { opacity:0.4; transform:scale(0.85); }
    50%      { opacity:1;   transform:scale(1.2); box-shadow:0 0 6px rgba(163,217,255,0.8); }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="ring-outer"></div>
  <div class="ring-mid"></div>

  <canvas id="clock" width="260" height="260"></canvas>

  <div class="digital">
    <div class="digital-time">
      <span id="hhmm">00:00</span><span class="seconds">:<span id="ss">00</span></span>
    </div>
    <div class="digital-date" id="dateStr">Monday, January 1</div>
    <div class="digital-label">QS1 · System Time</div>
  </div>

  <div class="live-badge">
    <span class="live-dot"></span>
    Algorithm Active
  </div>
</div>

<script>
const canvas = document.getElementById('clock');
const ctx    = canvas.getContext('2d');
const CX = 130, CY = 130, R = 120;

const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

function draw() {
  const now  = new Date();
  const h    = now.getHours() % 12;
  const m    = now.getMinutes();
  const s    = now.getSeconds();
  const ms   = now.getMilliseconds();

  const sAngle = ((s + ms/1000) / 60)  * Math.PI * 2 - Math.PI/2;
  const mAngle = ((m + s/60)    / 60)  * Math.PI * 2 - Math.PI/2;
  const hAngle = ((h + m/60)    / 12)  * Math.PI * 2 - Math.PI/2;

  ctx.clearRect(0, 0, 260, 260);

  // ── Background glow ──
  const bgGlow = ctx.createRadialGradient(CX,CY,0, CX,CY,R);
  bgGlow.addColorStop(0,   'rgba(163,217,255,0.04)');
  bgGlow.addColorStop(0.6, 'rgba(10,12,18,0.98)');
  bgGlow.addColorStop(1,   'rgba(6,8,16,1)');
  ctx.beginPath();
  ctx.arc(CX,CY,R,0,Math.PI*2);
  ctx.fillStyle = bgGlow;
  ctx.fill();

  // ── Face ring gradient ──
  const rimGrad = ctx.createLinearGradient(CX-R,CY-R, CX+R,CY+R);
  rimGrad.addColorStop(0,   'rgba(163,217,255,0.55)');
  rimGrad.addColorStop(0.5, 'rgba(123,200,245,0.9)');
  rimGrad.addColorStop(1,   'rgba(163,217,255,0.25)');
  ctx.beginPath();
  ctx.arc(CX,CY,R,0,Math.PI*2);
  ctx.strokeStyle = rimGrad;
  ctx.lineWidth   = 1.5;
  ctx.stroke();

  // ── Inner ring ──
  ctx.beginPath();
  ctx.arc(CX,CY,R*0.85,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(163,217,255,0.05)';
  ctx.lineWidth   = 1;
  ctx.stroke();

  // ── Sweep progress arc (seconds) ──
  const sweepGrad = ctx.createLinearGradient(CX-R,CY, CX+R,CY);
  sweepGrad.addColorStop(0,   'rgba(245,158,11,0)');
  sweepGrad.addColorStop(0.5, 'rgba(245,158,11,0.6)');
  sweepGrad.addColorStop(1,   'rgba(252,211,77,0.9)');
  ctx.beginPath();
  ctx.arc(CX, CY, R - 6, -Math.PI/2, sAngle);
  ctx.strokeStyle = sweepGrad;
  ctx.lineWidth   = 2;
  ctx.lineCap     = 'round';
  ctx.stroke();

  // ── Hour markers ──
  for (let i = 0; i < 12; i++) {
    const a   = (i / 12) * Math.PI * 2 - Math.PI/2;
    const isQ = i % 3 === 0;
    const r1  = isQ ? R * 0.82 : R * 0.86;
    const r2  = isQ ? R * 0.93 : R * 0.91;
    ctx.beginPath();
    ctx.moveTo(CX + Math.cos(a)*r1, CY + Math.sin(a)*r1);
    ctx.lineTo(CX + Math.cos(a)*r2, CY + Math.sin(a)*r2);
    ctx.strokeStyle = isQ ? 'rgba(163,217,255,0.7)' : 'rgba(163,217,255,0.22)';
    ctx.lineWidth   = isQ ? 2 : 1;
    ctx.lineCap     = 'round';
    ctx.stroke();
  }

  // ── Minute markers ──
  for (let i = 0; i < 60; i++) {
    if (i % 5 === 0) continue;
    const a = (i / 60) * Math.PI * 2 - Math.PI/2;
    ctx.beginPath();
    ctx.moveTo(CX + Math.cos(a)*(R*0.89), CY + Math.sin(a)*(R*0.89));
    ctx.lineTo(CX + Math.cos(a)*(R*0.93), CY + Math.sin(a)*(R*0.93));
    ctx.strokeStyle = 'rgba(163,217,255,0.1)';
    ctx.lineWidth   = 0.75;
    ctx.stroke();
  }

  // ── Helper: glowing line ──
  function drawHand(angle, length, width, color, glowColor, glowSize) {
    const ex = CX + Math.cos(angle) * length;
    const ey = CY + Math.sin(angle) * length;
    // glow pass
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(ex, ey);
    ctx.strokeStyle = glowColor;
    ctx.lineWidth   = glowSize;
    ctx.lineCap     = 'round';
    ctx.shadowBlur  = 18;
    ctx.shadowColor = glowColor;
    ctx.stroke();
    ctx.shadowBlur  = 0;
    // main pass
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.lineTo(ex, ey);
    ctx.strokeStyle = color;
    ctx.lineWidth   = width;
    ctx.lineCap     = 'round';
    ctx.stroke();
  }

  // ── Hour hand ──
  drawHand(hAngle, R*0.48, 3,   '#A3D9FF', 'rgba(163,217,255,0.35)', 8);
  // ── Minute hand ──
  drawHand(mAngle, R*0.68, 2,   'rgba(163,217,255,0.8)', 'rgba(163,217,255,0.2)', 6);
  // ── Second hand ──
  // tail
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(CX + Math.cos(sAngle + Math.PI)*R*0.22, CY + Math.sin(sAngle + Math.PI)*R*0.22);
  ctx.strokeStyle = 'rgba(245,158,11,0.5)';
  ctx.lineWidth   = 1;
  ctx.stroke();
  // main
  ctx.beginPath();
  ctx.moveTo(CX, CY);
  ctx.lineTo(CX + Math.cos(sAngle)*R*0.82, CY + Math.sin(sAngle)*R*0.82);
  ctx.strokeStyle = 'rgba(245,158,11,0.95)';
  ctx.lineWidth   = 1;
  ctx.lineCap     = 'round';
  ctx.shadowBlur  = 12;
  ctx.shadowColor = 'rgba(245,158,11,0.7)';
  ctx.stroke();
  ctx.shadowBlur  = 0;

  // ── Center cap ──
  // outer glow ring
  ctx.beginPath();
  ctx.arc(CX,CY,8,0,Math.PI*2);
  ctx.fillStyle = 'rgba(163,217,255,0.12)';
  ctx.fill();
  // cap
  const capGrad = ctx.createRadialGradient(CX,CY,0, CX,CY,5);
  capGrad.addColorStop(0, '#E8F6FF');
  capGrad.addColorStop(1, '#A3D9FF');
  ctx.beginPath();
  ctx.arc(CX,CY,5,0,Math.PI*2);
  ctx.fillStyle = capGrad;
  ctx.shadowBlur  = 14;
  ctx.shadowColor = 'rgba(163,217,255,0.9)';
  ctx.fill();
  ctx.shadowBlur  = 0;
  // inner dot
  ctx.beginPath();
  ctx.arc(CX,CY,2,0,Math.PI*2);
  ctx.fillStyle = '#040405';
  ctx.fill();

  // ── QS1 label ──
  ctx.font = '500 8px Arial';
  ctx.fillStyle = 'rgba(163,217,255,0.22)';
  ctx.letterSpacing = '4px';
  ctx.textAlign = 'center';
  ctx.fillText('QS1', CX, CY + R*0.55);

  // ── Digital readout update ──
  const hh  = String(now.getHours()).padStart(2,'0');
  const mm  = String(now.getMinutes()).padStart(2,'0');
  const sec = String(s).padStart(2,'0');
  document.getElementById('hhmm').textContent = hh + ':' + mm;
  document.getElementById('ss').textContent   = sec;
  document.getElementById('dateStr').textContent =
    DAYS[now.getDay()] + ', ' + MONTHS[now.getMonth()] + ' ' + now.getDate();

  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
