<svg width="1040" height="360" viewBox="0 0 1040 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1040" height="360" fill="#0F0F0F"/>

  <defs>
    <linearGradient id="arc-grad" x1="0" y1="0" x2="1040" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="60%"  stop-color="#F8C54A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FDEFC3" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fill-grad" x1="0" y1="0" x2="1040" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#F59E0B" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.18"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dot-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Subtle grid -->
  <line x1="0"    y1="360" x2="1040" y2="360" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0"    y1="270" x2="1040" y2="270" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0"    y1="180" x2="1040" y2="180" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0"    y1="90"  x2="1040" y2="90"  stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="260"  y1="0"   x2="260"  y2="360" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="520"  y1="0"   x2="520"  y2="360" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="780"  y1="0"   x2="780"  y2="360" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>

  <!-- Fill under curve -->
  <path d="M0,350 C80,348 160,338 240,322 C320,305 380,290 460,258 C530,228 590,192 660,152 C720,116 780,72 860,36 C910,14 960,4 1040,0 L1040,360 L0,360 Z"
        fill="url(#fill-grad)"/>

  <!-- Main curve -->
  <path d="M0,350 C80,348 160,338 240,322 C320,305 380,290 460,258 C530,228 590,192 660,152 C720,116 780,72 860,36 C910,14 960,4 1040,0"
        stroke="url(#arc-grad)" stroke-width="3" fill="none"
        filter="url(#glow)" stroke-linecap="round"/>

  <!-- Endpoint glow rings -->
  <circle cx="1040" cy="0" r="22" fill="#F59E0B" fill-opacity="0.06"/>
  <circle cx="1040" cy="0" r="14" fill="#F59E0B" fill-opacity="0.10"/>
  <circle cx="1040" cy="0" r="7"  fill="#FDEFC3" fill-opacity="0.9" filter="url(#dot-glow)"/>

  <!-- X-axis ticks -->
  <line x1="260"  y1="352" x2="260"  y2="360" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="520"  y1="352" x2="520"  y2="360" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="780"  y1="352" x2="780"  y2="360" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
</svg>
